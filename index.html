
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Profile</title>
</head>

<body>

    <h1>Welcome to My Personal Profile</h1>

    <h2>About Me</h2>

    <p>
        My name is ARis. I am a passionate front-end developer
        who enjoys learning technology and building websites.
    </p>

    <!-- Profile image with meaningful alternative text -->
    <img
        src="images/ARis.jpeg"
        alt="A portrait of ARis"
        width="250"
        height="250"
    >

    <!-- Decorative image with empty alt attribute -->
    <img
        src="images/decorative.jpg"
        alt=""
        width="300"
        height="200"
    >

    <!-- Figure with a related caption -->
    <figure>
        <img
            src="images/workspace.jpg"
            alt="A computer setup used for web development"
            width="400"
            height="250"
        >

        <figcaption>
            My workspace where I practise web development.
        </figcaption>
    </figure>

    <h2>My Favourite Audio</h2>

    <audio controls>
        <source src="media/audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
        Please use a modern browser to listen to this audio.
    </audio>

    <h2>My Introduction Video</h2>

    <video controls width="400" height="300">
        <source src="media/introduction.mp4" type="video/mp4">
        Your browser does not support the video element.
        Please use a modern browser to watch this video.
    </video>

</body>
</html>
